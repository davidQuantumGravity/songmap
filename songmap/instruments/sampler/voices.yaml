    source: vcsl
    program: Chordophones/Composite Chordophones/Folk Harp.sfz
    family: string
    description: Warm plucked strings; ripples, arpeggios, and intimate counterpoint.
    range:
    - 36
    - 93
    params:
      release_mul: 0.05
      level: -6
