    title: TX81Z FM piano
    source: vcsl
    program: Electrophones/TX81Z - FM Piano.sfz
    family: keys
    description: Recorded FM keyboard; bright attack and rounded decay for funk, broken beat, and lo-fi chords.
    range:
    - 36
    - 96
