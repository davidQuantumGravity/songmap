voices:
  grand_piano:
    title: Kawai grand piano
    source: vcsl
    program: Chordophones/Zithers/Grand Piano, Kawai.sfz
    family: keys
    description: Acoustic grand with velocity layers and release noises; melody and chord accompaniment.
    range:
    - 21
    - 108
    params:
      release_mul: 0.7
