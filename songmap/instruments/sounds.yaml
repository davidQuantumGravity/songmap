# Named continuous sound recipes. A/B form the top row; C/D the bottom row.
violin_palette:
  title: Violin palette
  description: A solo vibrato, B violin section vibrato, C solo tremolo, D section
    spiccato. Crossfade layers with complementary gains; this is a hybrid sound, not
    a physical model.
  sources:
    a:
      use: sampler/solo_violin
      params: {}
    b:
      use: sampler/violins
      params: {}
    c:
      use: sampler/solo_violin_tremolo
      params: {}
    d:
      use: sampler/violins_spiccato
      params: {}
