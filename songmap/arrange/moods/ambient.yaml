# Atmosphere: long reverb, pads forward, drums barely there, everything drifting slowly.
mood: ambient
description: long reverb, pads forward, drums in the distance
mix:
  drums: {gain_db: -12}
  fx:    {gain_db: -8}
  lead:  {gain_db: 4}
  pad:   {gain_db: 3.4}
returns:
  hall: {seconds: 3.6, damping: 0.5, predelay: 0.03}
groove: {swing: 0.5, template: straight, humanize: {time_ms: 8, drift_ms: 6, vel: 0.03}, metric: 0.3}
parts_feel:
  kick: {hum_scale: 0.3}
  bass: {hum_scale: 0.6}
  arp:  {hum_scale: 0.5}
  pad:  {hum_scale: 1.5, strum_ms: 20}
  keys: {hum_scale: 1.3, strum_ms: 16, high_loud: 0.3, arch: 0.5}
  gtr:  {hum_scale: 1.1, strum_ms: 24}
