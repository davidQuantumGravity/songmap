# The Swarm (2:03): faithful v0.2 port of the original Oct-13 track (synth_v0 track B, 60 bars).
# Written by `songmap migrate examples/v0.1_yaml/week_oct13_swarm.songmap.yaml`, then given the details
# synth_v0 played that v0.1 never wrote down (tests/test_port.py checks every note against synth_v0):
#   - this song's own 12-step arp order and darker bass filter (700 Hz);
#   - the melody sits in octave 5 (deg 0 = E5);
#   - open hats (+open) under the lead sections.
songmap: 0.2
title: "Week of Oct 13 — The Swarm"
tempo: 120
meter: "4/4"
key: "E minor"
fps: 30
seed: 7
mood: v0              # synth_v0's ensemble, unperformed: a faithful port (the scene calls for techno)
tail_seconds: 3
video: {composition: WeekSwarm, frames: 3690}

instruments:
  bass: {cutoff: 700}

harmony:
  default: [Em, C, G, D]
  chord_bars: 2

motifs:
  m1: {deg: "0 -3 0 2 | 1/2 0", octave: 5}
  m2: {deg: "-2 -3 -2 0 | -1/2. -3/4", octave: 5}
  m3: {deg: "2 0 2 4 | 3/2 2", octave: 5}
  m4: {deg: "1/4. 0/8 -1/2 | -3/1", octave: 5}

# The arp figure, shared by every section (YAML anchors).
x-arp:
  up: &up {style: up, order: [0, 2, 1, 3, 0, 2, 4, 3, 1, 2, 0, 3]}
  dark: &dark {style: dark, order: [0, 2, 1, 3, 0, 2, 4, 3, 1, 2, 0, 3]}

sections:
  - {name: terminal, bars: 4, parts: {arp: *dark, fx: ticks, bass: sub}}
  - {name: swarm_in, bars: 4, parts: {drums: four_floor, bass: eighths, arp: *dark, fx: ticks}}
  - {name: goals, bars: 8, parts: {drums: full+fill, bass: eighths, arp: *up, pad: warm}}
  - {name: who, bars: 2, parts: {pad: dark, fx: ticks}}
  - {name: agents, bars: 16, like: goals, add: {drums: full+fill+open, lead: [m1, m2, m3, m4]}}
  - {name: so_what, bars: 2, parts: {pad: warm, arp: *dark, fx: ticks, bass: sub}}
  - {name: output, bars: 16, like: agents, add: {drums: full+fill+hats16+open, fx: ticks}}
  - {name: guardrails, bars: 4, parts: {pad: warm, arp: *dark, bass: sub}}
  - {name: summary, bars: 2, parts: {pad: warm, arp: *up}}
  - {name: end_card, bars: 2, parts: {pad: dark}}

events:
  - {at: swarm_in, type: impact}
  - {at: goals, type: riser, bars: 1}
  - {at: agents, type: impact}
  - {at: agents, type: riser, bars: 2}
  - {at: agents+8, type: riser, bars: 1}
  - {at: output, type: impact}
  - {at: output, type: riser, bars: 2}
  - {at: output+8, type: riser, bars: 1}
  - {at: summary, type: impact}
  - {at: end_card, type: impact}

master: legacy        # synth_v0's normalize + tanh, for the port check
