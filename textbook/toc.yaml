# The canonical table of contents of "Music Theory of Golden Harmony".
# The site is built from this file: python tools/textbook/build.py
# Each chapter's content lives in textbook/content/<id>.html; its audio in textbook/audio/<id>/.
# `mirror` links a Western chapter to its golden counterpart(s) and back.

title: "Music Theory of Golden Harmony"
subtitle: "Music theory from first principles, from the harmonic series to golden tones in 36-ET"
author: "David Chester"
edition: "First edition (draft)"
year: 2026
publisher: "Published by the author"
epigraph: "The truth is more subtle, and perhaps golden tones are here to stay."
epigraph_source: "David Chester, from the preface"
rights: "All rights reserved."
note: "The golden tonal system, the averaging principle and the systems of golden passing harmony are the author's. Mathematical results are proved or checked by exhaustive computation, as marked in the text; statements about perception are labelled as measurements or hypotheses."

parts:
