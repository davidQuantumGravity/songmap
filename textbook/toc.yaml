    title: "Front matter"
    chapters:
      - id: preface
        title: "Preface: the golden story"
        summary: "How a golden Pythagorean scale was found, what it promises, and what it does not."
        sections:
          - {id: discovery, title: "A scale from the golden ratio"}
          - {id: averaging, title: "Between major and minor"}
          - {id: unification, title: "36-ET: three Western systems and the golden one"}
          - {id: why-now, title: "Why now: exploring with a machine"}
          - {id: origins, title: "Origins: bliss, brain waves and an argument"}
          - {id: ears, title: "The evolving ear"}
      - id: reading
        title: "How to read this book"
        summary: "Three layers of depth, reading paths, notation at a glance, and how the audio was made."
        sections:
          - {id: layers, title: "Hear it, Understand it, Derive it"}
          - {id: paths, title: "Reading paths"}
          - {id: notation, title: "Notation at a glance"}
          - {id: audio, title: "About the audio examples"}

