# ch37: a passing key. C major -> vE golden7 (two bars) -> ^C minor. vE golden7 = C vEb vE vF ^G
# ^Ab B shares two notes with C major (C, B) and two with ^C minor (^G, ^Ab), and lies 7 + 7
# sixth-steps of voice leading between them (direct: 10), the best golden7 bridge for this pair.
# Entry: C -> Cg (projection of the tonic). The passing tonic vEg is approached by circle steps
# from both sides (Cg -> vEg, ^Gg -> vEg) on strong beats. Exit: vEg -> Cg -> ^Cm, where Cg is the
# projection of ^Cm (a pivot of the silver-third keys, ch35); then i - iv - V - i in ^C minor.
