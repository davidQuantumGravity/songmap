# ch37: the golden-third key cycle through projections. C major -> vE major -> ^G major -> B major,
# each tonic a golden third (11 sixth-steps) above the last; three steps fall a semitone, back on
# the 12-ET layer. Each move goes through two golden chords: the projection of the old tonic, one
# golden-circle step, and the projection of the new tonic (C - Cg - vEg - vE, 2 + 3 + 2 = 7
# sixth-steps, which equals the direct distance C -> vE: a smoothest voice leading). Doc demo D18,
# voiced explicitly so that every voice moves monotonically.
