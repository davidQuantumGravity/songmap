# ch37: a golden pedal. Every note lies in exactly three golden triads, and they are neighbours
# on the golden circle: C is the root of Cg, the third of ^Abg and the fifth of vFg (circle
# positions 0, -1, -2). So a held C supports a three-chord walk of the circle, Cg - ^Abg - vFg
# and back, and the phrase releases onto C major over the same pedal (doc demo D15).
# The bass holds C2 throughout; the organ voices the upper chords.
songmap: 0.2
title: "A golden pedal on C"
tempo: 72
meter: "4/4"
key: "C major"
tuning: 36edo
seed: 372
tail_seconds: 3
instruments:
  organ: sampler/grand_piano
  low: clean/bass
mix:
  organ:
    gain_db: 17.5
    send:
      hall: 0.25
  low:
    gain_db: -5
sections:
  - name: three
    bars: 3
    harmony: "Cg/C:1 ^Abg/C:1 vFg/C:1"
    parts:
      organ: {notes: "=mp [c,ve,^g]1 | [c,ve,^ab]1 | [c,vf,^ab]1"}
      low: {notes: "=mp c--1 | c--1 | c--1"}
  - name: walk
    bars: 8
    harmony: "C:1 Cg/C:1 ^Abg/C:1 vFg/C:1 ^Abg/C:1 Cg/C:1 C:2"
    parts:
