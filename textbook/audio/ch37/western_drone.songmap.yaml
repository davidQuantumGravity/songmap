# ch37: Western chords over two drones, on harmonic tones. The same progression C - Am - F - G - C
# is played first over a C major drone (C3 E3 G3), then over a Cg drone (C3 vE3 ^G3); the last
# chord returns to the C major drone, the deepest rest. In the roughness model (harmonic partials
# 1..8, triads in close root position from C4..B4) every Western triad of C major is rougher over
# the Cg drone, by 0.18 (F) to 1.00 (Em).
