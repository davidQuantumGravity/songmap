# ch37: golden planing is three-key polytonality. Every voice is a plain major-key line: the
# lowest in C major, the middle in vE major (a golden third higher, layer v), the top in ^G
# major (a golden fifth higher, layer ^). The three keys share no note. Sounding together,
# every vertical is a golden triad on the lowest note.
# 1. Definition: the C major scale descending, planed in golden triads, then release onto C major.
# 2. A short tune: the C major line alone, then with its vE major copy (golden thirds),
#    then with the ^G major copy as well (golden triads), then release onto C major.
