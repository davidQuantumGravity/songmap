# ch37: golden giant steps. The major-third cycle C - Ab - E - C (the root motion of Coltrane's
# changes) first plain, then with one strict passing chord per move (System 1, the first passing
# chord P1 = (2X + Y)/3 voice by voice). By the quality theorem each is the golden triad on the
# upper root: C - Cg - Ab - Abg - E - Eg - C. Written out here in close voicing; doc demo D17
# (`C:1 ~:1 Ab:1 ~:1 E:1 ~:1 C:2`) makes the engine choose the same three golden chords.
# The three golden chords sit 12 steps apart on the 36-step golden circle.
songmap: 0.2
