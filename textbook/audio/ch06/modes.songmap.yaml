# Ch. 6, modes: the seven diatonic modes on C, from the one whose tonic is lowest on the chain of
# fifths (Lydian) to the highest (Locrian). Each step lowers one note by a semitone:
# Lydian F# -> Ionian F; B -> Bb (Mixolydian); E -> Eb (Dorian); A -> Ab (Aeolian);
# D -> Db (Phrygian); G -> Gb (Locrian). A low C drone holds throughout.
