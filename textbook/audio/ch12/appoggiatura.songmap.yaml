    bars: 4
    parts:
      up: {notes: "=mp [a-,c]1 [e-,g-]1 [a-,c]1 [e-,g-]1"}
      low: {notes: "=mp f--1 c-1 f--1 c-1"}
      mel: {notes: "=mf f2 a2 d+2 c+2 f2 a2 c+1"}
master: clean
