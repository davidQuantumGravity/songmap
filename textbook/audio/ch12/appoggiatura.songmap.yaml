# F: F A, then over C the melody leaps to D (a dissonance on the beat) and steps down to C.
# Then the same phrase without the appoggiatura.
songmap: 0.2
title: "An appoggiatura"
tempo: 72
meter: "4/4"
key: "C major"
tuning: 12edo
seed: 1
tail_seconds: 2
instruments:
  up: sampler/grand_piano
  low: clean/bass
  mel: sampler/flute
mix:
  up:
    gain_db: 15.0
    send:
      hall: 0.25
  low:
    gain_db: -5
  mel:
    gain_db: 1.5
    send:
      hall: 0.25
returns: {hall: {type: reverb, seconds: 2.4, predelay: 0.02, damping: 0.5}}
sections:
