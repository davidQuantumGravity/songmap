# ch39: (a) Em -> vEg -> Cg -> C: B rises to C while vE and ^G are held (a golden double suspension);
# then vE rises (retardation) and ^G falls (suspension) together. (b) the same two bends one at a time:
# Cg -> C(^5) -> C and Cg -> C(v3) -> C. (c) a falling chain: C#g -> vFg -> ^Abg -> Cg -> C, voices falling
# a semitone in turn over a C pedal, then the projection straightens.
