# Fibonacci groove (ch49, "Quasicrystal"): a straight kick with a rim, first repeating one bar (the Fibonacci word's
# first bar, looped), then the Fibonacci word itself, which never repeats; a shaker plays the word's other letter.
songmap: 0.2
title: "Fibonacci groove"
tempo: 124
meter: "4/4"
key: Dm
fps: 30
seed: 74
tail_seconds: 2

mood: techno
instruments:
  drums: {kit: {kick: {use: kick/v0, tune: 47, sweep: 30, decay: 0.48, click: 0.3, drive: 2.2}, rim: {use: kick/v0, tune: 86, sweep: 8, sweep_time: 0.04, decay: 0.35, click: 0.22, drive: 1.3}, shaker: {use: hat/v0, decay: 0.03, hp: 8000, metal: 0.2}}}

sections:
  - {name: looped, bars: 4, parts: {drums: {steps: {kick: X...X...X...X..., rim: {steps: ".x..x.x..x..x.x.", vel: [0.3, 0.22, 0.27]}}}}, dyn: mf}
  - {name: fibonacci, bars: 8, parts: {drums: {steps: {kick: X...X...X...X..., rim: {steps: ".x..x.x..x..x.x.|.x.x..x..x.x..x.|.x.x..x.x..x..x.|x..x.x..x..x.x..|x..x.x..x.x..x..|x.x..x..x.x..x.x|..x..x.x..x.x..x|..x.x..x..x.x..x", vel: [0.3, 0.22, 0.27]}, shaker: {steps: "x.xx.x.xx.xx.x.x|x.x.xx.xx.x.xx.x|x.x.xx.x.xx.xx.x|.xx.x.xx.xx.x.xx|.xx.x.xx.x.xx.xx|.x.xx.xx.x.xx.x.|xx.xx.x.xx.x.xx.|xx.x.xx.xx.x.xx.", vel: [0.26, 0.14, 0.2, 0.12]}}}}, dyn: mf}

mix:
  drums: {gain_db: -4}

master: clean
