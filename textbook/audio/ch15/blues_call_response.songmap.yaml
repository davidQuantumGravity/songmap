# Call and response in a 12-bar blues in C (C7 F7 C7 G7 F7 C7). In each four-bar line a two-bar
# "call" (lead) is answered by a two-bar "response" (keys). Lines 1 and 2 use the same call (the
# AAB pattern of blues lyrics); line 3 has a new call. Written for this book; straight eighths.
