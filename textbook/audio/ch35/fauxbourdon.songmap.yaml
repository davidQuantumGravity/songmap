# Parallel sixth-three sonorities in the style of 15th-century fauxbourdon (written for this book).
# Top: a D-mode line. Bottom: a sixth below the top. Middle: a fourth below the top.
# Every sonority is a third plus a sixth (a "6/3" chord) until the cadence, where the sixth E-C#
# opens to the octave D-D and the middle voice lands on the fifth A.
