# Parallel organum (a D-mode phrase written for this book, not a real chant):
#   1. the principal voice alone (monophony, as in chant)
#   2. with an organal voice a perfect fourth below, in strict parallel motion
#   3. with an organal voice a perfect fifth below
# (12-ET here; the medieval Pythagorean fourths and fifths differ from these by under 2 cents.)
