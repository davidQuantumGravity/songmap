# ch36 pentatonic mirror: a key change by a limma splits the scale into a part that stays and a part that moves.
# 12-ET: the white keys (C major), the black keys (a pentatonic); C major -> Db major keeps C and F and moves the
# pentatonic D E G A B. Golden: golden13 on C -> golden13 on vC# (up a golden limma, two sixth-steps) keeps the golden
# triad vEbg (vEb ^F# Bb) and moves the ten notes of the 35 decatonic C C# D vE vF vF# ^G ^Ab ^A B.
