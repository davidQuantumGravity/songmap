    gain_db: 13.3
    pan: 0.25
    send:
      hall: 0.2
  a:
    gain_db: 13.1
    pan: 0.1
    send:
      hall: 0.2
  t:
    gain_db: 13.5
    pan: -0.1
    send:
      hall: 0.2
  b:
