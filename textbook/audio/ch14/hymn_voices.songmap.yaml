  - name: all
    bars: 4
    parts:
      s: {notes: "r1 | =mf e+2 e+ | f+ f+ | d+ c+"}
      a: {notes: "r1 | =mf g2 a | a a | g e"}
      t: {notes: "r1 | =mf c2 c | c d | b- c"}
      b: {notes: "r1 | =mf c-2 a-- | f-- d-- | g-- c-"}
master: clean
