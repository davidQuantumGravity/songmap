# A six-chord progression I-vi-IV-ii-V-I in four parts (soprano, alto, tenor, bass), written note
# by note: the bass alone, then the soprano alone, then all four voices together.
#   S: E5 E5 F5 F5 D5 C5   A: G4 A4 A4 A4 G4 E4   T: C4 C4 C4 D4 B3 C4   B: C3 A2 F2 D2 G2 C3
songmap: 0.2
title: "Four voices"
tempo: 72
meter: "4/4"
key: "C major"
tuning: 12edo
seed: 14
tail_seconds: 2.5
instruments:
  s: sampler/grand_piano
  a: sampler/grand_piano
  t: sampler/grand_piano
  b: sampler/grand_piano
mix:
