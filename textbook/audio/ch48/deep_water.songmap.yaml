# 3. Deep Water. Still Water, song 3 of 5 (textbook Chapter 48). The deepest point of the suite: golden harmony on
# golden-spectrum timbres only (a golden pad, glass bells, a low glass gong), 44 BPM, no drums and no steady pulse.
# The bells fall on a Fibonacci-word rhythm (long, short, long, long, short, ...: 13 dotted halves and 8 halves,
# 55 beats), which never settles into a repeating bar. The harmony stays on the golden chords that keep A
# (vDg, ^Fg, vDg7), with one visit to A#g, the only chord here without it. Near the end the music thins to the
# golden pad alone, so the hidden layer is nearly all there is; then the harmony turns towards ^Fg and song 4.
# Hidden layer (headphones): pairs on the golden chain A3 : A3*phi : A3*phi^2 (220, 355.97, 575.97 Hz,
# the notes of vDg; the third joins in `depth`), beating at 6.18, 3.82 and 2.36 Hz (theta, with a delta undertone);
# the three are the first, second and fourth partials of a golden-spectrum A3. In `rising` the top pair
# crossfades to A4/phi (271.93 Hz, vC#4) so all three are tones of ^Fg.
# Breath: two-bar phrases of 10.9 s (5.5 a minute); the layer swells once per phrase.
# Form (42 bars): descent 5, depth 21, stillness 8, rising 8.
songmap: 0.2
title: "Deep Water"
tempo: 44
meter: "4/4"
key: "A golden7"
tuning: "36edo"
fps: 30
seed: 50
tail_seconds: 8

mood: ambient
instruments:
  gold: {use: clean/golden_pad, release: 2.5}
  bell: clean/glass
  voice: {use: clean/glass, decay: 6, damp: 0.6}
  gong: {use: clean/glass, decay: 9, damp: 0.4}
  host: {use: clean/golden_pad, release: 3}

harmony:
  progressions: {descent: "vDg:5", depth: "vDg:3 ^Fg:2 vDg7:3 A#g:2 vDg:3 ^Fg:3 vDg7:2 ^Fg:3", stillness: "vDg:8", rising: "^Fg:3 vDg7:2 ^Fg:3"}

sections:
  - {name: descent, bars: 5, parts: {gold: hold, gong: {rel: "R/1 | r/1 | r/1", oct: -1}, host: {notes: "=pp a-1 | =p a-1"}}, harmony: descent, dyn: "pp<p"}
  - {name: depth, bars: 21, parts: {gold: hold, bell: {rel: "=pp 5/2. 3+/2 R+/2. 5+/2. 3+/2 5/2. 3+/2 R+/2. 5+/2. 3+/2 5/2. 3+/2. R+/2 5+/2. 3+/2 5/2. 3+/2. R+/2 5+/2. 3+/2 5/2.", oct: 1}, voice: {deg: "=p 5/1 | 3/1 | 0/1 | 2/1 | r/1 | 0/2. 2/4 | 3/1 | r/1 | 1/1 | 3/1 | 5/1 | 7/2 5/2 | 3/1 | 2/1 | 0/1 | r/1 | 2/2 3/2 | 5/1 | 5/1 | 7/1 | r/1"}, gong: {rel: "R/1 | r/1 | r/1", oct: -1}, host: {notes: "=pp a-1 | =p a-1"}}, harmony: depth, dyn: p, binaural: {carriers: [A3, "A3*phi", "A3*phi^2"]}}
  - {name: stillness, bars: 8, parts: {gold: hold, host: {notes: "=pp a-1 | =p a-1"}, gong: {rel: "R/1 | r/1 | r/1 | r/1 | r/1 | r/1 | r/1 | r/1", oct: -1}}, harmony: stillness, dyn: "p>pp"}
  - {name: rising, bars: 8, parts: {gold: hold, bell: {rel: "=pp 5/2. 3+/2 R+/2. 5+/2. 3+/2 5/2. 3+/2 R+/2. 5+/2. 3+/2 5/2. 3+/2. R+/2 5+/2. 3+/2 5/2. 3+/2. R+/2 5+/2. 3+/2 5/2.", oct: 1}, voice: {deg: "=pp r/1 | 5/1 | 7/1 | r/1 | 2/1 | 0/1 | 5/1 | r/1"}, host: {notes: "=pp a-1 | =p a-1"}}, harmony: rising, dyn: "pp<p", binaural: {carriers: [A3, "A3*phi", "A4*phi^-1"]}}

