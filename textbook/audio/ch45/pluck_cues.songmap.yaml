# A short plucked phrase for the animation plan. `songmap render` writes its sections and beat grid,
# in seconds and video frames (30 fps, 20 frames per beat at 90 BPM), to cues.json.
# Harmony with System 2 placeholders: C - vFg/C - F - G - vCg/G - C, arpeggiated (gentle8, then roll16).
songmap: 0.2
title: "A phrase to animate"
tempo: 90
meter: "4/4"
key: "C major"
tuning: 36edo
seed: 9
fps: 30
tail_seconds: 3
instruments:
  gtr: sampler/folk_harp
  low: clean/bass
sections:
  - {name: a, bars: 4, harmony: "C:0.75 ~g:0.25 F:1 G:0.75 ~g:0.25 C:1", parts: {gtr: {style: gentle8, role: arp}, low: bassline}}
  - {name: b, bars: 4, harmony: "C:0.75 ~g:0.25 F:1 G:0.75 ~g:0.25 C:1", parts: {gtr: {style: roll16, role: arp}, low: bassline}}
mix:
  gtr:
    gain_db: 0.8
    send:
      hall: 0.25
  low:
    gain_db: -6
master: clean
