# The same upper notes B D F Ab (G#), with the bass naming a different note as leading tone:
# B -> C, D -> Eb, F (E#) -> F#, G# -> A.
songmap: 0.2
title: "One diminished seventh, four tonics"
tempo: 80
meter: "4/4"
key: "C major"
tuning: 12edo
seed: 1
tail_seconds: 2
instruments:
  up: sampler/grand_piano
  low: sampler/double_bass
mix:
  up:
    gain_db: 15.8
    send:
      hall: 0.25
  low:
    gain_db: 12.7
returns: {hall: {type: reverb, seconds: 2.4, predelay: 0.02, damping: 0.5}}
sections:
  - name: a
    bars: 4
    parts:
      up: {notes: "=mp [b-,d,f,ab]2 [c,e,g]2 [b-,d,f,ab]2 [bb-,eb,g]2 [b-,d,f,ab]2 [a#-,c#,f#]2 [b-,d,f,g#]2 [a-,c#,e]2"}
      low: {notes: "=mp b--2 c-2 d-2 eb-2 f-2 f#-2 g#--2 a--2"}
master: clean
